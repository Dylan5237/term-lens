[package]
name = "term-lens"
version = "0.1.0"
description = "AI 输出中英混杂术语实时注释工具 (Windows)"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
arboard = "3"
enigo = "0.2"
reqwest = { version = "0.12", features = ["json"] }
regex = "1"
toml = "0.8"
dirs = "5"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_Security"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
