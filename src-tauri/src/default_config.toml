# Term Lens 配置 (修改后自动生效: 每次兜底请求时重读)
# 产品: Windows 托盘划词注释器，不是终端透镜；不支持终端取词。
# H1: 云端默认关闭。base_url 为空则不发任何请求。
# 仅允许 https，或 host 为 loopback 的 http（127.0.0.1 / localhost / ::1）。
# 密钥不要写在本文件：使用 Windows 凭据管理器目标名 TermLens/api_key（或环境变量 TERM_LENS_API_KEY）。
# 本机 loopback 代理示例: base_url = "http://127.0.0.1:10100/v1"
# 官方 DeepSeek（OpenAI 兼容）: base_url = "https://api.deepseek.com"

[provider]
base_url = ""
api_key = ""
model = "deepseek-v4-flash"
timeout_ms = 3000
reasoning_off = true

[ui]
popup_width = 360.0
popup_height = 230.0
# "cursor"=跟随鼠标(默认)  "fixed"=固定屏幕右下角
position = "cursor"

[hotkey]
# "double_ctrl"=双击Ctrl(默认)  "alt_t"=Alt+T
mode = "double_ctrl"

[migrate]
# 已处理过 0.1.1 默认公网；此后用户填写 https://api.deepseek.com 会保留
cloud_default_cleared = true
