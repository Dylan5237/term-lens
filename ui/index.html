<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>TermLens</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="card">
  <div id="head">
    <span id="term">Term Lens</span>
    <span id="layer" class="chip"></span>
    <span id="domain"></span>
    <span id="offline">离线</span>
  </div>
  <div id="zh">Windows 托盘划词注释器</div>
  <div id="note">划选后双击 Ctrl（或 Alt+T）。优先读系统选区；读不到时短暂复制并立刻还原剪贴板。同一词可重复查询。</div>
  <div id="hint">不支持终端取词。默认无云端；没配好 loopback / https 白名单就不发外网。密钥走凭据管理器，不要写进 toml。</div>
  <div id="listHead" class="off">
    <span id="listUnknown"></span>
    <span id="listKnown"></span>
    <span id="listMore"></span>
  </div>
  <div id="loading"></div>
  <div id="termList"></div>
  <div id="cands"></div>
  <div id="fix">
    <textarea id="fixInput" rows="2" placeholder="输入正确译法（可多行）"></textarea>
    <div id="fixRow">
      <span id="fixHint">Ctrl+Enter 存 · Esc 取消</span>
      <button id="bFixOk">存</button>
    </div>
  </div>
  <div id="acts">
    <button id="bAdopt" class="primary">采纳</button>
    <button id="bFix">修改</button>
    <button id="bReject">否决</button>
  </div>
</div>
<script src="main.js"></script>
</body>
</html>
